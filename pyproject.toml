[project]
name = "fod-vision"
version = "0.1.0"
description = "FOD robot vision: dataset prep, fine-tuning, runtime export, on-device benchmarking, and the runtime the robot imports"
readme = "README.md"
# 3.11, not 3.12: the Pi runs fodcv.runtime on its *system* interpreter, which
# Bookworm pins at 3.11 because apt's picamera2 is built against it.
requires-python = ">=3.11"

# What `fodcv.runtime` needs, and nothing else. The robot repo installs this into
# the Pi's system python3.11 and must not get torch with it -- ultralytics lives in
# the `research` extra for exactly that reason. Both are already present on the Pi
# via apt's python3-opencv/python3-numpy, so this install adds almost nothing.
dependencies = [
    "numpy>=1.26",
    "opencv-python>=5.0.0.93",
]

[project.optional-dependencies]
# Everything Mac-side: training, dataset prep, export, and the Pi benchmark, all of
# which drive Ultralytics. Nothing under fodcv/runtime/ imports either of these.
research = [
    "pyyaml>=6.0",
    "ultralytics>=8.4.115",
]
# The Mac-side toolchain. Mostly converters, and none of those install on the
# Pi -- litert-torch ships no aarch64 wheel and coremltools is Apple-only --
# which is why export happens off-Pi and the artifacts are rsynced over. gdown
# is the odd one out: it fetches the FOD-A zip for fodcv-prepare and would
# install anywhere, but dataset prep is Mac-side too, so it rides along here
# rather than earning a third extra.
export = [
    "coremltools>=9.0",
    "gdown>=6.1.0",
    "litert-torch>=0.8.0",
    "nncf>=2.14.0",
    "onnx>=1.22.0",
    "onnxslim>=0.1.95",
    "pnnx>=20260526",
]
# Runtimes the benchmark loads artifacts into. Required on the Pi, and installed
# on the Mac too so a reference run can be taken there.
bench = [
    "ai-edge-litert>=2.1.2",
    "mnn>=3.0.0",
    "ncnn>=1.0.20240410",
    "onnxruntime>=1.28.0",
    "openvino>=2025.0.0",
]

[project.scripts]
# Pipeline order, Mac side.
fodcv-prepare = "fodcv.cli.prepare_dataset:main"
fodcv-smoke = "fodcv.cli.smoke_test:main"
fodcv-train = "fodcv.cli.train:main"
fodcv-migrate = "fodcv.cli.migrate_artifacts:main"
fodcv-export = "fodcv.cli.export:main"
# Pi side.
fodcv-bench = "fodcv.cli.bench_pi:main"
# Demos and camera helpers.
fodcv-policy = "fodcv.cli.confidence_policy:main"
fodcv-camera = "fodcv.cli.camera_test:main"
fodcv-list-cameras = "fodcv.cli.list_cameras:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fodcv"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
